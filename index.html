<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Pollos La Bomba y Papea, Horquetas de Sarapiquí. Abrimos el sábado 14 de noviembre.">
<meta name="theme-color" content="#171212">
<link rel="canonical" href="https://www.polloslabomba.com/">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="img/favicon-48.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_CR">
<meta property="og:site_name" content="Pollos La Bomba">
<meta property="og:title" content="Pollos La Bomba y Papea">
<meta property="og:description" content="Horquetas de Sarapiquí. Abrimos el sábado 14 de noviembre.">
<meta property="og:url" content="https://www.polloslabomba.com/">

<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* Concepto: pantalla partida. Izquierda Pollos La Bomba (en construcción), derecha Papea. */
:root{--bg:#171212;--fg:#FFFFFF;--gold:#F3A62C;--gold-ink:#171212;--red:#B81622;--red-ink:#FFFFFF;--left:#171212;--left-fg:#FFFFFF;--bar:#0E0A0A;--bar-fg:#F6EFE6;--display:'Figtree',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
body{min-height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;display:flex;flex-direction:column}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.split{flex:1 0 auto;display:grid;grid-template-columns:1fr 1fr}
.half{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:48px 20px;min-width:0}
.left{background:var(--left);color:var(--left-fg)}
.right{background:var(--red);color:var(--red-ink);text-decoration:none}
.tag{font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.left .tag{color:var(--gold)}
.right .tag{background:var(--gold);color:var(--gold-ink);padding:6px 14px;border-radius:999px}
h1,h2{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;margin:0;line-height:.98;text-wrap:balance}
.left h1{font-size:clamp(40px,8vw,84px)}
.right h2{font-size:clamp(56px,11vw,120px)}
.lema{font-size:clamp(18px,2.4vw,24px);font-weight:700;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 30px;border-radius:12px;font-weight:700;font-size:17px;font-family:var(--body);text-decoration:none;border:2px solid transparent}
.right .btn{background:var(--gold);color:var(--gold-ink)}
.right:hover .btn,.right:focus-visible .btn{background:var(--red-ink);}
.btn[aria-disabled="true"]{border-color:var(--left-fg);color:var(--left-fg);opacity:.75;cursor:not-allowed;background:transparent}
.soon{margin:0;font-size:16px;opacity:.9}
.logo img{display:block;width:clamp(200px,26vw,320px);height:auto}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.left .btn.gold{background:var(--gold);color:var(--gold-ink)}
.left .btn.line{border-color:var(--left-fg);color:var(--left-fg)}
.left .lema{color:var(--gold)}
.bar{background:var(--bar);color:var(--bar-fg);font-size:14px;font-weight:700;text-align:center;padding:12px 20px}
@media (max-width:700px){.split{grid-template-columns:1fr;grid-auto-rows:auto}.half{padding:44px 20px;min-height:50svh}}
</style>
<main class="split">
<section class="half left" aria-labelledby="t-pollos">
<span class="tag">Horquetas de Sarapiquí</span>
<h1 id="t-pollos" class="logo"><img src="img/logo-pollos-amarillo.png" width="700" height="701" alt="Pollos La Bomba"></h1>
<p class="lema">Abrimos el sábado 14 de noviembre</p>
<div class="btns">
<a class="btn gold" data-track="entrada-como-llegar" href="https://www.google.com/maps/search/?api=1&amp;query=10.333714181537344,-83.95064152587013" target="_blank" rel="noopener">Cómo llegar</a>
<a class="btn line" id="call" data-track="entrada-llamar" href="tel:+50672777303">Llamar al 7277-7303</a>
</div>
</section>
<a class="half right" href="papea/index.html" data-track="entrada-papea" aria-labelledby="t-papea">
<span class="tag">Nuevo</span>
<h2 id="t-papea">Papea</h2>
<p class="lema">Pura papa, pura vida.</p>
<p class="soon" style="max-width:320px">Papas fritas en cono y Caja Bomba. Ve el menú y arma tu pedido.</p>
<span class="btn">Ver menú y pedir</span>
</a>
</main>
<div class="bar">Todos los días de 10 a. m. a 10 p. m. Frente a Soda La Bomba y la Gasolinera JyJ.</div>

<script>
/* Analítica opcional y sin cookies (GoatCounter). Para activarla: crear cuenta gratis en goatcounter.com y poner aquí el código del sitio. Vacío: no se carga nada. */
var GC='';
function track(n){try{if(window.goatcounter&&window.goatcounter.count)window.goatcounter.count({path:n,title:n,event:true})}catch(e){}}
document.addEventListener('click',function(e){var a=e.target.closest('[data-track]');if(a)track(a.dataset.track)});
if(GC){var g=document.createElement('script');g.async=true;g.src='//gc.zgo.at/count.js';g.setAttribute('data-goatcounter','https://'+GC+'.goatcounter.com/count');document.head.appendChild(g)}
</script>
</body>
</html>
